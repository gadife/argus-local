name: macOS release package

# ARG-34: produce Darwin zip + SHA256 via CI (not Cursor Cloud Agents).
# Does NOT upload to the GitHub Release — App holds attach for Review+PM then Gadi.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "gadife/arg-34*"
    paths:
      - ".github/workflows/release-macos.yml"
      - "scripts/package-macos-release.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"

permissions:
  contents: read

jobs:
  package-macos-arm64:
    name: package macos-14 arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Package Darwin zip
        run: |
          chmod +x scripts/package-macos-release.sh
          ./scripts/package-macos-release.sh

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-local-macos-arm64
          path: |
            dist/argus-local-macos-arm64.zip
            dist/argus-local-macos-arm64.zip.sha256
            proof/arg-34/argus-local.sha256
            proof/arg-34/README-macOS.txt
          if-no-files-found: error