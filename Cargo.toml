[package]
name = "argus-local"
version = "0.1.0"
edition = "2021"
description = "Argus Local - one-process local HTML dashboard for Claude Code + Cursor session aggregates"
license = "MIT"
authors = ["Gadi Feldman"]

[[bin]]
name = "argus-local"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
tiny_http = "0.12"
open = "5"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"
