<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Argus Local</title>
<style>
:root {
  --bg:#0D0D0D; --card:#1A1A1A; --card2:#141414; --border:#2A2A2A;
  --text:#E8E8E8; --muted:#9CA3AF; --dim:#6B7280;
  --green:#4ADE80; --green-dim:rgba(74,222,128,0.15);
  --orange:#F59E0B; --orange-dim:rgba(245,158,11,0.15);
  --radius:10px; --sidebar:220px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:8px;background:#0A0A0A}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:600;letter-spacing:.2px}
.logo svg{width:22px;height:22px}
.nav button{width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px}
.nav button:hover{background:#161616;color:var(--text)}
.nav button.active{background:var(--green-dim);color:#fff;font-weight:600}
.nav .ico{width:16px;opacity:.85}
.table tr.sel{background:var(--green-dim);cursor:pointer}
.table tbody tr{cursor:pointer}
.table tbody tr:hover{background:#161616}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:8px}
.detail-grid .k{color:var(--dim);font-size:12px}
.detail-grid .v{color:var(--text);font-size:14px;font-weight:600}
.tel-sec{margin-top:14px}.tel-sec .section-title{margin-top:0}.detail-note{margin-top:14px;color:var(--dim);font-size:12px;line-height:1.45}
.act-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
@media (max-width:900px){.act-layout{grid-template-columns:1fr}}

.sidebar-foot{margin-top:auto;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card2)}
.share-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.pill{background:#222;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--text)}
.toggle{width:36px;height:20px;border-radius:999px;background:#333;position:relative;border:1px solid var(--border);cursor:default}
.toggle::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px}
.toggle.off::after{left:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 28px 8px;gap:16px;flex-wrap:wrap}
.h1{font-size:22px;font-weight:650;margin:0}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 28px 12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--card2)}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 14px;cursor:pointer;font-size:13px}
.seg button.on{color:var(--green);box-shadow:inset 0 0 0 1px var(--green);border-radius:999px}
.lock{font-size:12px;color:var(--dim)}
.banner{display:none;margin:0 28px 12px;padding:10px 14px;border-radius:var(--radius);border:1px solid rgba(245,158,11,0.45);background:var(--orange-dim);color:#FBBF24;font-size:13px;font-weight:500}
.banner.show{display:block}
.status{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px 16px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.warn{background:var(--orange)}
.content{padding:4px 28px 28px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:8px}
.kpi .val{font-size:28px;font-weight:650;letter-spacing:-.02em}
.kpi .sub{color:var(--dim);font-size:12px;margin-top:4px}
.section-title{font-size:13px;color:var(--muted);margin:6px 0 10px;font-weight:600}
.bytool{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.toolcard{position:relative;overflow:hidden}
.toolcard .name{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.toolcard .tok{font-size:14px}
.toolcard .sess{color:var(--dim);font-size:12px;margin-top:2px}
.bar{height:3px;background:#222;border-radius:2px;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.bar>i.warn{background:var(--orange)}
.warn-tag{display:inline-flex;align-items:center;gap:4px;color:var(--orange);font-size:11px;margin-top:6px}
.mid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;color:var(--dim);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border)}
.table td{padding:10px 6px;border-bottom:1px solid #222;color:var(--text)}
.table tr:last-child td{border-bottom:none}
.ship-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.ship-list li{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.ship-list strong{color:var(--text)}
.ship-note{margin-top:14px;font-size:11px;color:var(--dim);border-top:1px solid var(--border);padding-top:10px}
.stub-tag{display:inline-block;margin-left:6px;font-size:10px;color:var(--orange);border:1px solid rgba(245,158,11,0.4);border-radius:999px;padding:1px 6px;vertical-align:middle}
.active-tag{display:inline-block;margin-left:6px;font-size:10px;color:var(--green);border:1px solid rgba(74,222,128,0.4);border-radius:999px;padding:1px 6px;vertical-align:middle}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--dim)}
.footer-left{display:flex;align-items:center;gap:10px}
.insights-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.findings{display:flex;flex-direction:column;gap:10px}
.finding h3{margin:0 0 6px;font-size:15px}
.finding .sum{color:var(--text);font-size:13px}
.finding .ev{color:var(--dim);font-size:12px;margin-top:6px}
.ctx .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.ctx .row:last-child{border-bottom:none}
.ctx .bars{margin-top:12px}
.ctx .barline{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:var(--muted)}
.ctx .barline .track{flex:1;height:6px;background:#222;border-radius:4px;overflow:hidden}
.ctx .barline .track>i{display:block;height:100%;background:var(--green)}
.ctx-note{margin-top:12px;font-size:11px;color:var(--dim)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.bytool{grid-template-columns:repeat(2,1fr)}.mid,.insights-grid{grid-template-columns:1fr}}

.chip-prompts{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(74,222,128,.18);color:var(--ok);font-size:12px;font-weight:600;border:1px solid rgba(74,222,128,.35)}
.prompt-box{margin-top:14px;padding:12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.prompt-box h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.prompt-box pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;color:var(--text);max-height:9.5em;overflow:hidden}
.prompt-box pre.expanded{max-height:none}
.prompt-box .expand{margin-top:8px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:0}
.toggle.on{background:rgba(74,222,128,.35)}
.toggle.on::after{transform:translateX(18px)}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.gate .card{max-width:420px;margin:20px}

.coach-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.coach-chip{border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;background:rgba(255,255,255,.03)}
.coach-chip .ck{color:var(--dim);margin-right:6px}
.coach-note{color:var(--dim);font-size:11px;margin:4px 0 0}
.coach-dims{display:flex;flex-direction:column;gap:10px;margin:10px 0 4px}
.coach-dim{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
.coach-dim-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.coach-dim-title{font-size:13px;font-weight:600}
.coach-label{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--border);text-transform:lowercase}
.coach-label.observed{color:#4ADE80;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.coach-label.watch{color:#FBBF24;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.coach-label.thin{color:#F87171;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.coach-tip{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="9" ry="6" stroke="#4ADE80" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#4ADE80"/></svg>
      Argus Local
    </div>
    <nav class="nav" id="nav">
      <button data-page="today" class="active">Today</button>
      <button data-page="activity">Activity</button>
      <button data-page="tools">Tools</button>
      <button data-page="insights">Insights</button>
      <button data-page="shipping">Shipping</button>
      <button data-page="share">Share</button>
      <button data-page="settings">Settings</button>
    </nav>
    <div class="sidebar-foot">
      <div class="share-row">
        <span>Share to org <span class="pill">Argus</span></span>
        <div class="toggle off" id="shareToggle" title="Off"></div>
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--dim)">Off</div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 class="h1" id="title">Today — Last 7 days</h1>
    </div>
    <div class="controls">
      <div class="seg" id="period">
        <button data-d="1">1d</button>
        <button data-d="7" class="on">7d</button>
        <button data-d="30">30d</button>
      </div>
      <span class="lock" id="lockLine">Local only — estimates ≠ invoice</span>
    </div>
    <div class="banner" id="fixtureBanner">Demo fixtures — not live adapter data. Label shown so this is never silent fake-as-real.</div>
    <div class="status" id="status"></div>
    <div class="content" id="content"></div>
    <div class="footer">
      <div class="footer-left">
        <span id="footerLock">aggregates only — no raw prompts or code — local-first</span>
      </div>
      <div id="footerRight"></div>
    </div>
  </div>
</div>
<script>
let DATA=null, PAGE=(new URLSearchParams(location.search).get('page')||location.hash.replace('#','')||'today').toLowerCase(), DAYS=Number(new URLSearchParams(location.search).get('days')||7)||7;
const $=s=>document.querySelector(s);
function fmtTok(n){if(n==null||n===undefined)return '—'; if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function fmtTokKnown(n, known){return known ? fmtTok(n) : '—'}
function fmtUsd(n){return '$'+Math.round(n)}
function fmtUsdKnown(n, known){return known ? fmtUsd(n) : '—'}
function syncFixtureBanner(){
  const on=!!(DATA&&DATA.used_fixtures);
  $('#fixtureBanner').classList.toggle('show', on);
}

let PROMPTS_ENABLED=false;
let SESSION_DETAIL=null;
let PROMPTS_GATE_SEEN=sessionStorage.getItem('argus_prompts_gate')==='1';
function syncPromptsChrome(){
  const foot=$('#footerLock');
  const right=$('#footerRight');
  if(PAGE==='activity' && PROMPTS_ENABLED){
    if(foot) foot.textContent='local prompts on — never uploaded — Share Off';
  } else {
    if(foot) foot.textContent='aggregates only — no raw prompts or code — local-first';
  }
  if(right){
    right.innerHTML = PROMPTS_ENABLED ? '<span class="chip-prompts">Prompts on (local)</span>' : '';
  }
}
async function setPromptsEnabled(enabled){
  const r=await fetch('/api/settings/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!!enabled})});
  const j=await r.json();
  PROMPTS_ENABLED=!!(j.prompts_enabled);
  if(DATA) DATA.prompts_enabled=PROMPTS_ENABLED;
  syncPromptsChrome();
  return j;
}
function truncHtml(text, expanded){
  const raw=String(text??'');
  const limit=600;
  const needs=raw.length>limit;
  const shown=(!needs||expanded)?raw:raw.slice(0,limit)+'…';
  const btn=needs?`<button class="expand" data-expand="${expanded?'0':'1'}">${expanded?'Collapse':'Expand'}</button>`:'';
  return `<pre class="${expanded?'expanded':''}">${esc(shown)}</pre>${btn}`;
}

async function load(){
  const r=await fetch('/api/dashboard?days='+DAYS);
  DATA=await r.json();
  PROMPTS_ENABLED=!!(DATA&&DATA.prompts_enabled);
  syncPromptsChrome();
  render();
}
function statusHtml(st){
  // Only real adapter names with discovered data — never invent Codex/etc stubs
  return (st||[]).filter(s=>s && s.name && s.name!=='partial').map(s=>{
    const warn=s.partial||!s.ok;
    return `<span class="badge"><span class="dot ${warn?'warn':''}"></span>${esc(s.name)}</span>`;
  }).join('');
}
function shipVal(ship, key){
  if(!ship||ship.is_stub) return '—';
  const v=ship[key];
  return (v==null) ? '—' : String(v);
}
function renderToday(){
  const d=DATA.today;
  $('#title').textContent=`Today — Last ${DAYS} days`;
  $('#lockLine').textContent=d.language_lock.estimates_note;
  $('#status').innerHTML=statusHtml(d.adapter_status);
  syncFixtureBanner();
  const accept=d.tool_accept_pct==null?'—':(Math.round(d.tool_accept_pct)+'%');
  const tools=d.by_tool.map(t=>{
    const warn=t.cost_incomplete?`<div class="warn-tag">cost incomplete</div>`:'';
    const tokLabel=t.tokens_known?`${fmtTok(t.tokens)} tokens`:`— tokens`;
    const barW=t.tokens_known?Math.max(6,t.share_pct):0;
    return `<div class="card toolcard">
      <div class="name">${esc(t.tool)}</div>
      <div class="tok">${tokLabel}</div>
      <div class="sess">${t.sessions} sessions</div>
      ${warn}
      <div class="bar"><i class="${t.cost_incomplete?'warn':''}" style="width:${barW}%"></i></div>
    </div>`;
  }).join('');
  const rows=d.activity.slice(0,12).map(a=>`<tr data-sid="${esc(a.id)}" title="Open in Activity">
    <td>${esc(a.time_range)}</td><td>${esc(a.tool)}</td><td>${esc(a.model)}</td>
    <td>${fmtTokKnown(a.tokens,a.tokens_known)} tokens</td>
    <td>${a.cost_complete&&a.tokens_known?fmtUsd(a.est_spend_usd):'—'}</td></tr>`).join('');
  const ship=d.shipping||{};
  const stubTag=ship.is_stub?'<span class="stub-tag">unconfigured</span>':'';
  $('#content').innerHTML=`
    <div class="kpis">
      <div class="card kpi"><div class="label">Sessions</div><div class="val">${d.sessions}</div><div class="sub">${d.sessions_active>0?`${d.sessions-d.sessions_active} completed · ${d.sessions_active} active`:'Completed sessions'}</div></div>
      <div class="card kpi"><div class="label">Tokens</div><div class="val">${fmtTokKnown(d.tokens,d.tokens_known)}</div><div class="sub">${d.tokens_known?'Total estimated tokens':'Unknown — no token data'}</div></div>
      <div class="card kpi"><div class="label">$ Est. spend</div><div class="val">${d.tokens_known?fmtUsd(d.est_spend_usd):'—'}</div><div class="sub">estimate</div></div>
      <div class="card kpi"><div class="label">Tool accept</div><div class="val">${accept}</div><div class="sub">Accepted / proposed</div></div>
      <div class="card kpi"><div class="label">Models</div><div class="val">${d.models_unique}</div><div class="sub">Unique models used</div></div>
    </div>
    <div class="section-title">By tool</div>
    <div class="bytool">${tools}</div>
    <div class="mid">
      <div class="card">
        <div class="section-title" style="margin-top:0">Activity</div>
        <table class="table"><thead><tr><th>Time</th><th>Tool</th><th>Model</th><th>Tokens</th><th>Est.</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" style="color:var(--dim)">No activity in period</td></tr>'}</tbody></table>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Shipping (opt-in GitHub)${stubTag}</div>
        <ul class="ship-list">
          <li><span>Merged PRs</span><strong>${shipVal(ship,'merged_prs')}</strong></li>
          <li><span>Commits</span><strong>${shipVal(ship,'commits')}</strong></li>
          <li><span>Files touched</span><strong>${shipVal(ship,'files_touched')}</strong></li>
        </ul>
        <div class="ship-note">${esc(ship.note||'GitHub shipping not configured — not observed shipping data.')}</div>
      </div>
    </div>`;
}
function renderInsights(){
  const d=DATA.insights; const c=d.context;
  $('#title').textContent=`Insights — Last ${DAYS} days`;
  $('#lockLine').textContent=d.language_lock.observations_note;
  $('#status').innerHTML=statusHtml(c.adapter_status);
  syncFixtureBanner();
  const findings=d.findings.map(f=>`<div class="card finding">
    <h3>${esc(f.title)}</h3>
    <div class="sum">${esc(f.summary)}</div>
    <div class="ev">${esc(f.evidence)}</div>
  </div>`).join('');
  const bars=(c.by_tool||[]).map(t=>{
    const tok=t.tokens_known?fmtTok(t.tokens):'—';
    const w=t.tokens_known?Math.max(4,t.share_pct):0;
    return `<div class="barline"><span style="width:90px">${esc(t.tool)}</span>
    <div class="track"><i style="width:${w}%"></i></div>
    <span>${tok}</span></div>`;
  }).join('');
  const accept=c.tool_accept_pct==null?'—':(Math.round(c.tool_accept_pct)+'%');
  $('#content').innerHTML=`
    <div class="insights-grid">
      <div class="findings">${findings}</div>
      <div class="card ctx">
        <div class="section-title" style="margin-top:0">Context</div>
        <div class="row"><span>Sessions</span><strong>${c.sessions}${c.sessions_active>0?` <span style="color:var(--dim);font-weight:400">(${c.sessions_active} active)</span>`:''}</strong></div>
        <div class="row"><span>Tokens</span><strong>${fmtTokKnown(c.tokens,c.tokens_known)}</strong></div>
        <div class="row"><span>Est. spend</span><strong>${c.tokens_known?fmtUsd(c.est_spend_usd)+' <span style="color:var(--dim);font-weight:400">estimate</span>':'—'}</strong></div>
        <div class="row"><span>Tool accept</span><strong>${accept}</strong></div>
        <div class="bars"><div class="section-title">By tool</div>${bars}</div>
        <div class="ctx-note">Not ranked vs peers — not a productivity score</div>
      </div>
    </div>`;
}
function renderShipping(){
  const d=DATA.today; const ship=d.shipping||{};
  $('#title').textContent='Shipping - Last '+DAYS+' days';
  $('#lockLine').textContent=(d.language_lock&&d.language_lock.shipping_note)||'correlation with sessions - not a productivity score';
  $('#status').innerHTML=statusHtml(d.adapter_status);
  syncFixtureBanner();
  const stubTag=ship.is_stub?'<span class="stub-tag">unconfigured</span>':'';
  const who=ship.login?('<div class="ship-note" style="border:0;padding-top:0;margin-top:0">user '+esc(ship.login)+' via '+esc(ship.auth_source||'?')+'</div>'):'';
  $('#content').innerHTML='<div class="card"><div class="section-title" style="margin-top:0">Shipping (opt-in GitHub)'+stubTag+'</div>'+who+'<ul class="ship-list"><li><span>Merged PRs</span><strong>'+shipVal(ship,'merged_prs')+'</strong></li><li><span>Commits</span><strong>'+shipVal(ship,'commits')+'</strong></li><li><span>Files touched</span><strong>'+shipVal(ship,'files_touched')+'</strong></li></ul><div class="ship-note">'+esc(ship.note||'GitHub shipping not configured.')+'</div><p style="color:var(--dim);font-size:12px;margin:12px 0 0">correlation with sessions - not a productivity score; estimates != invoice; observations not a score; Share Off default</p></div>';
}
function renderSettings(){
  const cfg=!!(DATA&&DATA.github_configured);
  const ship=(DATA&&DATA.today&&DATA.today.shipping)||{};
  $('#title').textContent='Settings';
  $('#lockLine').textContent='opt-in GitHub + local prompts — never invent / never upload';
  syncFixtureBanner();
  syncPromptsChrome();
  const on=PROMPTS_ENABLED;
  $('#content').innerHTML=`<div class="card">
    <div class="section-title" style="margin-top:0">Local prompts</div>
    <div class="toggle-row">
      <div>
        <div style="font-weight:600">Show prompt / response text</div>
        <div style="color:var(--dim);font-size:12px;margin-top:4px">Default Off. Local only — never uploaded. Share stays Off.</div>
      </div>
      <div class="toggle ${on?'on':'off'}" id="promptsToggle" title="${on?'On':'Off'}"></div>
    </div>
    <p style="color:var(--dim);font-size:12px;margin:12px 0 0">When Off: Activity detail stays aggregates only — no raw prompts. When On: detail may show on-device text from adapters that expose it (missing fields stay hidden).</p>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="section-title" style="margin-top:0">GitHub shipping</div>
    <p style="color:var(--muted)">Configured now: <strong style="color:var(--text)">${cfg?'yes':'no'}</strong>${ship.login?(' · '+esc(ship.login)+' via '+esc(ship.auth_source||'?')):''}</p>
    <p style="color:var(--muted);font-size:13px">How to configure (secrets stay on this machine — never commit PATs):</p>
    <ol style="color:var(--muted);font-size:13px;line-height:1.6"><li>Set env <code>ARGUS_GITHUB_TOKEN</code> to a personal PAT, or</li><li>Set <code>ARGUS_GITHUB_ENABLED=1</code> and use authenticated <code>gh</code>, or</li><li>Write <code>{"github":{"enabled":true}}</code> to <code>%LOCALAPPDATA%/argus-local/settings.json</code>.</li></ol>
    <p style="color:var(--dim);font-size:12px">When unconfigured, Shipping shows dashes — no fake stub counts. Share Off default.</p>
  </div>`;
  const tog=$('#promptsToggle');
  if(tog) tog.addEventListener('click', async ()=>{
    const next=!PROMPTS_ENABLED;
    if(next && !PROMPTS_GATE_SEEN){
      const ok=confirm('Enable local prompt/response text in Activity detail?\\n\\nText stays on this device — never uploaded. Share stays Off.');
      if(!ok) return;
      PROMPTS_GATE_SEEN=true;
      sessionStorage.setItem('argus_prompts_gate','1');
    }
    await setPromptsEnabled(next);
    renderSettings();
  });
}

function hideField(v){return v==null||v===''||v===undefined}
function fmtNum(n){if(n==null)return null;return Number(n).toLocaleString()}
function fmtPct(p){if(p==null)return null;return (Math.round(p*10)/10)+'%'}
function fmtMs(n){if(n==null)return null;return Math.round(n)+' ms'}
function sectionBlock(title, rows){
  const items=rows.filter(r=>!hideField(r[1]));
  if(!items.length) return '';
  return `<div class="tel-sec"><div class="section-title">${esc(title)}</div><div class="detail-grid">${items.map(([k,v])=>`<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join('')}</div></div>`;
}

function coachingSection(c){
  if(!c) return '';
  const chips=[];
  if(c.tool_failure_count!=null){
    const denom=c.tool_call_count!=null?(' / ' + fmtNum(c.tool_call_count) + ' calls'):'';
    chips.push(['Tool failures', fmtNum(c.tool_failure_count) + denom]);
  }
  if(c.identical_tool_streak!=null && c.identical_tool_name){
    chips.push(['Identical run', `\`${esc(c.identical_tool_name)}\` x ${fmtNum(c.identical_tool_streak)}`]);
  }
  if(c.explore_count!=null || c.act_count!=null){
    chips.push(['Explore vs act', `${fmtNum(c.explore_count)||0} explore / ${fmtNum(c.act_count)||0} act`]);
  }
  if(c.checks_after_edits!=null && c.edits_count!=null){
    const w=c.checks_window!=null?c.checks_window:5;
    chips.push(['Checks after edits', fmtNum(c.checks_after_edits) + ' of ' + fmtNum(c.edits_count) + ' within ' + w]);
  }
  if(c.subagent_spawn_count!=null || c.subagent_dir_count!=null){
    const parts=[];
    if(c.subagent_spawn_count!=null) parts.push(`${fmtNum(c.subagent_spawn_count)} spawned`);
    if(c.subagent_dir_count!=null) parts.push(`${fmtNum(c.subagent_dir_count)} dirs`);
    chips.push(['Subagents', parts.join(' / ')]);
  }
  if(!chips.length) return '';
  const row=chips.map(([k,v])=>`<span class="coach-chip"><span class="ck">${esc(k)}</span> ${v}</span>`).join('');
  return `<div class="tel-sec"><div class="section-title">Coaching</div><div class="coach-row">${row}</div><p class="coach-note">observations, not a score \u00b7 Share Off \u00b7 no prompts</p></div>`;
}
function coachDimensionsSection(dims){
  if(!dims || !dims.length) return '';
  const rows=dims.map(d=>{
    const lab=(d.label||'').toLowerCase();
    return `<div class="coach-dim"><div class="coach-dim-top"><span class="coach-dim-title">${esc(d.title||d.id)}</span><span class="coach-label ${esc(lab)}">${esc(lab)}</span></div><p class="coach-tip">${esc(d.tip||'')}</p></div>`;
  }).join('');
  return `<div class="tel-sec"><div class="section-title">Coach</div><div class="coach-dims">${rows}</div><p class="coach-note">coach, don\u2019t rank \u00b7 no score \u00b7 Share Off</p></div>`;
}
function sessionDetailHtml(a, detail){
  if(!a) return '<p style="color:var(--dim);margin:0">Select a session for aggregates (no prompts or code).</p>';
  if(!detail){
    const tok=(!a.tokens_known)?'\u2014':(!a.cost_complete?`${fmtTok(a.tokens)} <span style="color:var(--dim);font-weight:400">context (not billable in/out)</span>`:`${fmtTok(a.tokens)} <span style="color:var(--dim);font-weight:400">(in ${fmtTok(a.input_tokens)} / out ${fmtTok(a.output_tokens)})</span>`);
    return `<div class="detail-grid">
      <div><div class="k">Session id</div><div class="v" style="font-weight:500;font-size:12px;word-break:break-all">${esc(a.id)}</div></div>
      <div><div class="k">Status</div><div class="v">${a.is_active?'<span class="active-tag" style="margin-left:0">active</span>':'completed'}</div></div>
      <div><div class="k">Tool</div><div class="v">${esc(a.tool)}</div></div>
      <div><div class="k">Model</div><div class="v">${esc(a.model)||'\u2014'}</div></div>
      <div><div class="k">${a.cost_complete?'Tokens':'Tokens / context'}</div><div class="v">${tok}</div></div>
    </div><p class="detail-note">Loading session detail\u2026</p>`;
  }
  const t=detail.telemetry||{};
  const ctxUsed=fmtNum(t.context_tokens_used);
  const ctxWin=fmtNum(t.context_window_tokens);
  const ctxPct=fmtPct(t.context_pct);
  const ctxVal=(ctxUsed!=null&&ctxWin!=null)?(`${ctxUsed} / ${ctxWin}`+(ctxPct!=null?` (${ctxPct})`:'')):(ctxUsed!=null?ctxUsed:null);
  const ctx=sectionBlock('Context', [
    ['Context used / window', ctxVal],
    ['Note', t.context_note?`<span style="color:var(--dim);font-weight:400">${esc(t.context_note)}</span>`:null],
  ]);
  const io=sectionBlock('Billable I/O', [
    ['Input tokens', fmtNum(t.input_tokens)],
    ['Output tokens', fmtNum(t.output_tokens)],
    ['Total tokens', fmtNum(t.total_tokens)],
    ['Reasoning tokens', fmtNum(t.reasoning_tokens)],
    ['Model calls', fmtNum(t.model_calls)],
    ['API duration', t.api_duration_ms!=null?(fmtNum(t.api_duration_ms)+' ms'):null],
    ['Est. spend', t.cost_usd_estimate!=null?(fmtUsd(t.cost_usd_estimate)+' <span style="color:var(--dim);font-weight:400">'+(t.cost_note?esc(t.cost_note):'estimate \u2260 invoice')+'</span>'):null],
  ]);
  const cache=sectionBlock('Cache', [
    ['Cached read tokens', fmtNum(t.cached_read_tokens)],
    ['Cache creation tokens', fmtNum(t.cache_creation_tokens)],
  ]);
  const toolsUsed=(t.tools_used&&t.tools_used.length)?esc(t.tools_used.join(', ')):null;
  const sig=sectionBlock('Signals', [
    ['Turns', fmtNum(t.turn_count)],
    ['Tool calls', fmtNum(t.tool_call_count)],
    ['Tools used', toolsUsed],
    ['Avg TTFT', fmtMs(t.avg_time_to_first_token_ms)],
    ['Avg response', fmtMs(t.avg_response_time_ms)],
    ['Session duration', t.session_duration_seconds!=null?(fmtNum(t.session_duration_seconds)+' s'):null],
  ]);
  const sum=sectionBlock('Summary', [
    ['Title', t.generated_title?esc(t.generated_title):null],
    ['Kind', t.session_kind?esc(t.session_kind):null],
    ['Status', a.is_active?'<span class="active-tag" style="margin-left:0">active</span>':'completed'],
    ['cwd', t.cwd?esc(t.cwd):null],
    ['Model', t.model?esc(t.model):(a.model?esc(a.model):null)],
    ['Source', esc(a.source||a.tool)],
    ['Session id', `<span style="font-weight:500;font-size:12px;word-break:break-all">${esc(a.id)}</span>`],
  ]);
  const coach=coachingSection(detail.coaching);
  const coachDims=coachDimensionsSection(detail.coach_dimensions);
  let promptsBlock='';
  if(PROMPTS_ENABLED){
    const p=detail.prompt_text, r=detail.response_text;
    if(!p && !r){
      promptsBlock=`<div class="prompt-box"><div class="warn-tag" style="display:inline-block;margin-bottom:6px">prompts missing</div><div style="color:var(--dim);font-size:12px">Prompts on (local) \u2014 no on-disk prompt/response text for this session.</div></div>`;
    } else {
      promptsBlock='<div class="prompt-box" id="promptBlocks">';
      if(p) promptsBlock+=`<h4>Prompt</h4>${truncHtml(p,false)}`;
      if(r) promptsBlock+=`<h4 style="margin-top:12px">Response</h4>${truncHtml(r,false)}`;
      promptsBlock+='<div class="detail-note" style="margin-top:10px">Local only \u2014 never uploaded \u2014 Share Off</div></div>';
    }
  } else {
    promptsBlock='<p class="detail-note">aggregates only \u2014 no raw prompts or code \u2014 local-first \u00b7 estimates \u2260 invoice \u00b7 Share Off \u00b7 observations, not a score</p>';
  }
  return `${sum}${ctx}${io}${cache}${sig}${promptsBlock}`;
}
let DETAIL_CACHE={};
async function loadSessionDetail(id){
  if(!id) return null;
  if(DETAIL_CACHE[id]) return DETAIL_CACHE[id];
  try{
    const r=await fetch('/api/session/'+encodeURIComponent(id)+'?days='+DAYS);
    if(!r.ok) return null;
    const j=await r.json();
    DETAIL_CACHE[id]=j;
    return j;
  }catch(e){return null}
}
}
let SELECTED_SESSION=(new URLSearchParams(location.search).get('sid')||null);
function renderActivity(){
  const d=DATA.today;
  $('#title').textContent=`Activity \u2014 Last ${DAYS} days`;
  $('#lockLine').textContent=(d.language_lock&&d.language_lock.observations_note)||'Local only \u2014 observations, not a score';
  $('#status').innerHTML=statusHtml(d.adapter_status);
  syncFixtureBanner();
  syncPromptsChrome();
  const list=(d.activity||[]);
  if(SELECTED_SESSION && !list.some(a=>a.id===SELECTED_SESSION)) SELECTED_SESSION=null;
  if(!SELECTED_SESSION && list.length) SELECTED_SESSION=list[0].id;
  const rows=list.map(a=>{
    const sel=a.id===SELECTED_SESSION?' sel':'';
    return `<tr class="${sel.trim()}" data-sid="${esc(a.id)}">
      <td>${esc(a.time_range)}</td><td>${a.is_active?'<span class="active-tag" style="margin-left:0">active</span>':''}</td><td>${esc(a.tool)}</td><td>${esc(a.model)||'\u2014'}</td>
      <td>${fmtTokKnown(a.tokens,a.tokens_known)}</td>
      <td>${a.duration?esc(a.duration):'\u2014'}</td>
      <td>${a.cost_complete?'':'!'}</td></tr>`;
  }).join('');
  const selected=list.find(a=>a.id===SELECTED_SESSION);
  const sid=SELECTED_SESSION;
  $('#content').innerHTML=`
    <div class="act-layout">
      <div class="card">
        <div class="section-title" style="margin-top:0">Sessions</div>
        <table class="table" id="actTable"><thead><tr><th>Time</th><th>Status</th><th>Tool</th><th>Model</th><th>Tokens</th><th>Dur</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="7" style="color:var(--dim)">No sessions in period</td></tr>'}</tbody></table>
      </div>
      <div class="card" id="actDetailCard">
        <div class="section-title" style="margin-top:0">Session detail</div>
        <div id="sessionDetailPane">${sessionDetailHtml(selected, DETAIL_CACHE[sid]||null)}</div>
      </div>
    </div>`;
  const table=$('#actTable');
  if(table) table.addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-sid]'); if(!tr)return;
    SELECTED_SESSION=tr.getAttribute('data-sid');
    SESSION_DETAIL=null;
    renderActivity();
  });
  const detailCard=$('#actDetailCard');
  if(detailCard) detailCard.addEventListener('click',e=>{
    const b=e.target.closest('button.expand'); if(!b)return;
    const pre=b.previousElementSibling;
    if(!pre) return;
    const expand=b.getAttribute('data-expand')==='1';
    const which = pre.previousElementSibling && /response/i.test(pre.previousElementSibling.textContent||'') ? 'response' : 'prompt';
    const d = DETAIL_CACHE[SELECTED_SESSION] || SESSION_DETAIL;
    const full = which==='response' ? (d&&d.response_text) : (d&&d.prompt_text);
    if(full==null) return;
    const wrap=document.createElement('div');
    wrap.innerHTML=truncHtml(full, expand);
    pre.replaceWith(wrap.firstChild);
    b.replaceWith(wrap.querySelector('button.expand')||document.createTextNode(''));
  });
  if(sid){
    loadSessionDetail(sid).then(j=>{
      if(SELECTED_SESSION!==sid) return;
      SESSION_DETAIL=j;
      const pane=$('#sessionDetailPane');
      if(pane) pane.innerHTML=sessionDetailHtml(selected, j);
    });
  }
}
function renderStub(name){
  $('#title').textContent=name+' — stub';
  $('#lockLine').textContent='Local only — observations, not a score';
  syncFixtureBanner();
  $('#content').innerHTML=`<div class="card"><p style="color:var(--muted);margin:0">${esc(name)} is a navigation stub in v1. Today + Insights are live.</p>
  <p style="color:var(--dim);font-size:12px">aggregates only — no raw prompts or code — local-first</p></div>`;
}
function render(){
  if(!DATA)return;
  syncPromptsChrome();
  if(PAGE==='today')renderToday();
  else if(PAGE==='activity')renderActivity();
  else if(PAGE==='insights')renderInsights();
  else if(PAGE==='shipping')renderShipping();
  else if(PAGE==='settings')renderSettings();
  else renderStub(PAGE[0].toUpperCase()+PAGE.slice(1));
  // Today activity rows → Activity drill-in
  const todayTable=$('#content table.table');
  if(PAGE==='today' && todayTable){
    todayTable.addEventListener('click',e=>{
      const tr=e.target.closest('tr[data-sid]'); if(!tr)return;
      SELECTED_SESSION=tr.getAttribute('data-sid');
      PAGE='activity';
      [...$('#nav').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x.dataset.page==='activity'));
      render();
    });
  }
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...$('#nav').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));
  PAGE=b.dataset.page; render();
});
$('#period').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...$('#period').querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));
  DAYS=Number(b.dataset.d);
  [...document.querySelectorAll('#nav button')].forEach(x=>x.classList.toggle('active', x.dataset.page===PAGE));
  [...document.querySelectorAll('#period button')].forEach(x=>x.classList.toggle('on', Number(x.dataset.d)===DAYS));
  load();
});
[...document.querySelectorAll('#nav button')].forEach(x=>x.classList.toggle('active', x.dataset.page===PAGE));
[...document.querySelectorAll('#period button')].forEach(x=>x.classList.toggle('on', Number(x.dataset.d)===DAYS));
load();
</script>
</body>
